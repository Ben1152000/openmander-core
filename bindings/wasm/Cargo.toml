[package]
name = "openmander-wasm"
version = { workspace = true }
edition = { workspace = true }
publish = false

[lib]
name = "openmander"
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
anyhow = "1"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
# ahash (and other deps) pull in getrandom 0.3; enable wasm_js backend so it compiles for WASM.
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

# For WASM: disable parquet and download (C deps don't compile for WASM)
# PMTiles is WASM-compatible and uses GZip compression (no zstd)
openmander-core = { package = "openmander", path = "../..", default-features = false, features = ["pmtiles", "wasm-console"] }
